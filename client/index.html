<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/dimli.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <!-- Uygulama her zaman koyu: WebView gece modunda sayfayı "force-dark" ile tekrar karartmasın/ters
       çevirmesin (sayfa kendi koyu temasını yönetiyor). -->
  <meta name="color-scheme" content="dark" />
  <title>DİMLİ - Halı Saha Kültürü</title>

  <!-- Fonts bundled via @fontsource/inter (no network request) -->
  <style>
    /* Custom Safe Area Utilities */
    .pt-safe-top {
      padding-top: env(safe-area-inset-top);
    }

    .pb-safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .top-safe-top {
      top: env(safe-area-inset-top);
    }

    .bottom-safe-bottom {
      bottom: env(safe-area-inset-bottom);
    }

    /* Ensure fixed elements respect safe area */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Notification bell — sits below status bar on both iOS and Android.
       On iOS env(safe-area-inset-top) ≈ 47px; on Android it falls back to 24px. */
    .top-bell-safe {
      top: calc(max(env(safe-area-inset-top), 24px) + 12px);
    }

    /* Hide Navbar when modal is open */
    body.modal-open nav {
      display: none !important;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body
  class="bg-[#0f172a] text-gray-900 dark:bg-pitch dark:text-white transition-colors duration-200 font-sans selection:bg-turf-500 selection:text-white">
  <div id="root"></div>
  <div id="recaptcha-container"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
