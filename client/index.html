<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>DIMLİ - Halı Saha Kültürü</title>

  <!-- Sporty Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Inter:wght@400;600;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media', // or 'class'
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            sport: ['"Barlow Condensed"', 'sans-serif'],
          },
          spacing: {
            'safe-top': 'env(safe-area-inset-top)',
            'safe-bottom': 'env(safe-area-inset-bottom)',
            'safe-left': 'env(safe-area-inset-left)',
            'safe-right': 'env(safe-area-inset-right)',
          },
          colors: {
            turf: {
              50: '#f0fdf4',
              100: '#dcfce7',
              400: '#4ade80',
              500: '#22c55e', // Neon Green-ish
              600: '#16a34a',
              900: '#14532d',
              neon: '#39FF14', // Pure Neon
            },
            pitch: {
              DEFAULT: '#0f172a', // Slate 900
              surface: '#1e293b', // Slate 800
              card: '#334155', // Slate 700
            }
          },
          boxShadow: {
            'neon': '0 0 10px rgba(34, 197, 94, 0.5)',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Safe Area Utilities */
    .pt-safe-top {
      padding-top: env(safe-area-inset-top);
    }

    .pb-safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .top-safe-top {
      top: env(safe-area-inset-top);
    }

    .bottom-safe-bottom {
      bottom: env(safe-area-inset-bottom);
    }

    /* Ensure fixed elements respect safe area */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Hide Navbar when modal is open */
    body.modal-open nav {
      display: none !important;
    }
  </style>
  <script type="importmap">
{

    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",

  }
}
</script>

<body
