<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/dimli.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>DİMLİ - Halı Saha Kültürü</title>

  <!-- Sporty Fonts — async load, render-blocking değil -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Inter:wght@400;600;800&display=swap"
    as="style" onload="this.rel='stylesheet'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet">
  </noscript>
  <style>
    /* Custom Safe Area Utilities */
    .pt-safe-top {
      padding-top: env(safe-area-inset-top);
    }

    .pb-safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .top-safe-top {
      top: env(safe-area-inset-top);
    }

    .bottom-safe-bottom {
      bottom: env(safe-area-inset-bottom);
    }

    /* Ensure fixed elements respect safe area */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Notification bell — sits below status bar on both iOS and Android.
       On iOS env(safe-area-inset-top) ≈ 47px; on Android it falls back to 24px. */
    .top-bell-safe {
      top: calc(max(env(safe-area-inset-top), 24px) + 12px);
    }

    /* Hide Navbar when modal is open */
    body.modal-open nav {
      display: none !important;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body
  class="bg-[#0f172a] text-gray-900 dark:bg-pitch dark:text-white transition-colors duration-200 font-sans selection:bg-turf-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
